name: iam-local

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: iam
      POSTGRES_PASSWORD: iam
      POSTGRES_DB: iam_qa
    volumes:
      - iam_pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iam -d iam_qa"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: apps/backend
    env_file:
      - apps/backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://iam:iam@db:5432/iam_qa
      DB_SSL: disable
      ALLOW_MOCK_AUTH: "true"
      FRONTEND_URL: http://localhost:4321
      RESEND_API_KEY: ""
      # Local S3 mock instead of the production R2 bucket (overrides .env creds).
      R2_ENDPOINT_URL: http://localhost:9000
      R2_ACCOUNT_ID: local
      R2_ACCESS_KEY_ID: minioadmin
      R2_SECRET_ACCESS_KEY: minioadmin-local-secret
      R2_BUCKET: iam-qa
      R2_PUBLIC_BASE: http://localhost:8787
      MEDIA_JWT_SECRET: local-qa-media-secret-0123456789abcdef
    depends_on:
      db:
        condition: service_healthy
      s3:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  s3:
    image: adobe/s3mock:latest
    user: "0:0"
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: iam-qa
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /tmp/s3mock
    volumes:
      - iam_s3:/tmp/s3mock
    ports:
      - "127.0.0.1:9000:9090"

  media-gateway:
    build:
      context: infra/local-media
    environment:
      MEDIA_JWT_SECRET: local-qa-media-secret-0123456789abcdef
      S3_ENDPOINT: http://s3:9090
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin-local-secret
      S3_BUCKET: iam-qa
    depends_on:
      - s3
    ports:
      - "127.0.0.1:8787:8787"

  seed:
    profiles: ["seed"]
    build:
      context: apps/backend
    environment:
      DATABASE_URL: postgresql+asyncpg://iam:iam@db:5432/iam_qa
      DB_SSL: disable
    depends_on:
      backend:
        condition: service_healthy
    command: ["python", "seed_e2e.py"]
    restart: "no"

  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install --global pnpm@10.11.0 && pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 4321"
    environment:
      PUBLIC_API_URL: http://localhost:8000
      PUBLIC_ALLOW_MOCK_AUTH: "true"
      VITE_NEON_AUTH_URL: ${VITE_NEON_AUTH_URL:-https://ep-dawn-dew-ai5mwyh8.neonauth.c-4.us-east-1.aws.neon.tech/neondb/auth}
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "127.0.0.1:4321:4321"
    depends_on:
      - backend

volumes:
  iam_pgdata:
  frontend_node_modules:
  iam_s3:

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificado — {{ course_title }} | IAM Formación</title>
  <meta name="description" content="Certificado de finalización de {{ student_name }} en el curso {{ course_title }}.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --brand:   #1448E0;
      --bg:      #EEF2FF;
      --surface: #FFFFFF;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --border:  #C7D2FE;
      --radius:  16px;
      --shadow:  0 4px 24px rgba(20, 72, 224, 0.10);
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 640px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .logo-mark {
      width: 36px;
      height: 36px;
      background: var(--brand);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-mark svg { color: #fff; }

    .logo-name {
      font-size: 1.125rem;
      font-weight: 700;
      color: var(--brand);
      letter-spacing: -0.02em;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 640px;
      padding: 40px 32px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #EEF2FF;
      border: 1px solid var(--border);
      border-radius: 100px;
      padding: 4px 14px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--brand);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 28px;
    }

    .badge-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--brand);
    }

    .student-name {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text-primary);
      text-align: center;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .completion-text {
      font-size: 0.9375rem;
      color: var(--text-secondary);
      text-align: center;
      margin-bottom: 20px;
    }

    .divider {
      width: 48px;
      height: 3px;
      background: var(--brand);
      border-radius: 2px;
      margin: 0 auto 20px;
    }

    .course-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--brand);
      text-align: center;
      letter-spacing: -0.015em;
      margin-bottom: 16px;
    }

    .issued-date {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    /* ── QR ── */
    .qr-wrap {
      background: #EEF2FF;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 28px;
    }

    .qr-wrap img {
      display: block;
      width: 140px;
      height: 140px;
    }

    /* ── Share button ── */
    .btn-share {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--brand);
      color: #fff;
      font-family: inherit;
      font-size: 0.9375rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      cursor: pointer;
      transition: opacity 0.15s;
      text-decoration: none;
    }

    .btn-share:hover { opacity: 0.88; }

    .btn-share svg { flex-shrink: 0; }

    /* ── Footer ── */
    footer {
      margin-top: 32px;
      width: 100%;
      max-width: 640px;
      text-align: center;
    }

    .cert-id {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-family: 'Courier New', monospace;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
    }

    .verify-note {
      font-size: 0.75rem;
      color: #94A3B8;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0F172A;
      color: #fff;
      font-size: 0.875rem;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 8px;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      .card { padding: 28px 20px 24px; }
      .student-name { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M10 2L3 6V10C3 13.866 6.134 17.396 10 18C13.866 17.396 17 13.866 17 10V6L10 2Z" fill="white" fill-opacity="0.9"/>
      </svg>
    </div>
    <span class="logo-name">IAM Formación</span>
  </header>

  <main>
    <article class="card" role="main" aria-label="Certificado de finalización">

      <span class="badge">
        <span class="badge-dot" aria-hidden="true"></span>
        Certificado verificado
      </span>

      <h1 class="student-name">{{ student_name }}</h1>

      <p class="completion-text">ha completado satisfactoriamente el curso</p>

      <div class="divider" aria-hidden="true"></div>

      <h2 class="course-title">{{ course_title }}</h2>

      <time class="issued-date" datetime="{{ issued_at_es }}">
        Emitido el {{ issued_at_es }}
      </time>

      <div class="qr-wrap" aria-label="Código QR de verificación">
        <img
          src="{{ qr_data_uri }}"
          alt="QR de verificación del certificado"
          width="140"
          height="140"
        />
      </div>

      <button class="btn-share" id="share-btn" type="button" aria-label="Compartir certificado">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
          <polyline points="16 6 12 2 8 6"/>
          <line x1="12" y1="2" x2="12" y2="15"/>
        </svg>
        Compartir
      </button>

    </article>
  </main>

  <footer>
    <p class="cert-id">Certificado #{{ public_uuid }}</p>
    <p class="verify-note">Este certificado es verificable en la URL de esta página.</p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
    (function () {
      var btn = document.getElementById('share-btn');
      var toast = document.getElementById('toast');
      var verifyUrl = {{ verify_url | tojson }};

      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(function () { toast.classList.remove('show'); }, 2500);
      }

      btn.addEventListener('click', function () {
        if (navigator.share) {
          navigator.share({
            title: 'Mi certificado — IAM Formación',
            text: 'He completado el curso y obtuve este certificado.',
            url: verifyUrl,
          }).catch(function () {});
        } else {
          navigator.clipboard.writeText(verifyUrl).then(function () {
            showToast('URL copiada al portapapeles');
          }).catch(function () {
            showToast('No se pudo copiar la URL');
          });
        }
      });
    })();
  </script>

</body>
</html>
